name: Desktop Package

# 仅按需验证桌面包与安装副本冒烟，不发布：不升版本、不发 npm、不碰 GitHub Release。
# 存在的理由：release.yml 的 desktop-unsigned 绑在 Release 上（需先有 tag 与 npm 发布），
# desktop-candidate.yml 又强制签名，三者之间缺一个「只打包、只冒烟」的迭代入口——
# 修 Windows 打包/冷启动问题时不必为每次验证消耗一个发布版本号。
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 打包平台
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}-${{ inputs.platforms }}
  cancel-in-progress: true

jobs:
  locate:
    # 把平台选择展开成矩阵，避免在 matrix 上写条件表达式。
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          case "$PLATFORMS" in
            windows) entries='{"runner":"windows-2025","target":"win32-x64"}' ;;
            macos) entries='{"runner":"macos-15","target":"darwin-arm64"},{"runner":"macos-15-intel","target":"darwin-x64"}' ;;
            linux) entries='{"runner":"ubuntu-24.04","target":"linux-x64"}' ;;
            all) entries='{"runner":"macos-15","target":"darwin-arm64"},{"runner":"macos-15-intel","target":"darwin-x64"},{"runner":"windows-2025","target":"win32-x64"},{"runner":"ubuntu-24.04","target":"linux-x64"}' ;;
            *) echo "未知平台：$PLATFORMS" >&2; exit 1 ;;
          esac
          echo "matrix={\"include\":[$entries]}" >> "$GITHUB_OUTPUT"

  package:
    needs: locate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.locate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 12.4.1
          runtime: node@24
          require-lockfile: true
          cache: true
      - name: Check native target
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: node -e 'if (`${process.platform}-${process.arch}` !== process.env.EXPECTED_TARGET) process.exit(1)'
      - name: Install pinned Electron
        run: pnpm --filter @kiturone/kapibala-desktop exec install-electron
      # --no-verify 跳过重复的桌面门禁（同 SHA 的 Verify 工作流已覆盖），只做打包与安装副本冒烟。
      - name: Build test package
        if: runner.os != 'Linux'
        id: package
        run: pnpm pack:desktop --no-verify
      - name: Build test package under a real virtual display
        if: runner.os == 'Linux'
        id: linux-package
        run: xvfb-run -a pnpm pack:desktop --no-verify
      - name: Upload installers for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-package-${{ matrix.target }}-${{ github.sha }}
          path: ${{ steps.package.outputs.artifacts || steps.linux-package.outputs.artifacts }}
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload packaged smoke diagnostics
        # 安装副本冒烟失败时保存 Playwright trace/error-context，供离线定位。
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-diagnostics-${{ matrix.target }}-${{ github.sha }}
          path: packages/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 14
