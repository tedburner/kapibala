name: Native release evidence

on:
  push:
    branches: ['codex/v0.0.10-native-evidence']

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: d6d73ac8149f4afc23b7b2e8d25ae64f494625c0
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/setup@v3
        with:
          version: 12.4.1
          install: false
          cache: false
      - name: Build the unchanged candidate and install only the acceptance driver
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C candidate install --frozen-lockfile
          pnpm -C candidate dev --no-verify --no-start
          npm ci --prefix harness/scripts/native-acceptance --allow-scripts=node-pty
      - name: Real native terminal and second-user acceptance
        run: node harness/scripts/native-acceptance/probe.mjs candidate evidence
      - name: Preserve raw observations, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: evidence/
          if-no-files-found: ignore
