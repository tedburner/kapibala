name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish or retry (for example v0.0.4)
        required: true
        type: string
      desktop_only:
        # 补跑未签名桌面包：跳过 verify 与 publish，只向已存在的 Release 增量上传四平台安装包。
        # 用于发布后 desktop-unsigned 部分平台失败且 npm/Release 已成型的场景，不重建 Release。
        description: 只重打未签名桌面包并补传到已存在的 Release（跳过 verify 与 publish）
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: kapibala-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      desktop: ${{ steps.source.outputs.desktop }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      KPBL_RELEASE_EVIDENCE: ${{ vars.KPBL_RELEASE_EVIDENCE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/setup@v3
        with:
          version: 12.4.1
          install: false
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Validate release source and version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.ts check "$RELEASE_TAG"
          sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$sha" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          if [ -f packages/desktop/package.json ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi
      # 2026-11-14 维护者决定：v0.1.0 以未签名个人自用版交付，人工验收证据不再是发布前置。
      # 默认只跑自动门禁（verify 工作流全矩阵 + release 长跑 + 安装 smoke）；把仓库变量
      # KPBL_RELEASE_STRICT 设为 true 即恢复六类专项的同 SHA 审核清单强制检查。
      # 口径见 docs/release-evidence.md 与 docs/desktop-release.md。
      - name: Check reviewed acceptance evidence
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          KPBL_STRICT: ${{ vars.KPBL_RELEASE_STRICT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$KPBL_STRICT" = "true" ]; then
            pnpm verify:release-evidence --sha "$RELEASE_SHA"
          else
            echo "::warning::已按个人自用版口径跳过六类人工验收证据检查（KPBL_RELEASE_STRICT 未开启）。本次发布不宣称 Node 20、Windows 跨用户 ACL/ConPTY、POSIX PTY、跨解释器进程树、MCP 与 release 长跑已完成人工审核。"
          fi

  verify:
    needs: prepare
    if: inputs.desktop_only != true
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      soak_tier: release

  publish:
    needs: [prepare, verify]
    if: inputs.desktop_only != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      KPBL_RELEASE_EVIDENCE: ${{ vars.KPBL_RELEASE_EVIDENCE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/setup@v3
        with:
          version: 12.4.1
          install: false
          cache: false
      - name: Install from lockfile and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Validate source and pack
        env:
          KPBL_STRICT: ${{ vars.KPBL_RELEASE_STRICT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          node scripts/release.ts check "$RELEASE_TAG"
          if [ "$KPBL_STRICT" = "true" ]; then
            pnpm verify:release-evidence --sha "$RELEASE_SHA"
          else
            echo "::warning::发布前证据检查按个人自用版口径跳过；恢复严格门禁请设置 KPBL_RELEASE_STRICT=true。"
          fi
          release_dir="$RUNNER_TEMP/kapibala-release"
          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
          mkdir -p "$release_dir"
          pnpm -C packages/core pack --pack-destination "$release_dir"
          pnpm -C packages/mcp pack --pack-destination "$release_dir"
          pnpm -C packages/cli pack --pack-destination "$release_dir"
      # 默认跳过：未签名自用版只发三份 npm 包，桌面测试包由维护者手工上传。
      # 将来拿到证书、走完候选审核后，把仓库变量 KPBL_DESKTOP_RELEASE 设为 true 即恢复严格附件流程。
      - name: Download only reviewed desktop artifacts
        if: needs.prepare.outputs.desktop == 'true' && vars.KPBL_DESKTOP_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop-candidate.ts download "$RELEASE_SHA" "$RELEASE_VERSION" "$RELEASE_DIR/desktop"
      - name: Publish Core, MCP, then CLI using npm trusted publishing
        run: node scripts/release.ts publish "$RELEASE_TAG" "$RELEASE_DIR"
      - name: Verify installation from the public registry
        run: node scripts/release.ts smoke "$RELEASE_TAG" "$RUNNER_TEMP/kapibala-registry-smoke"
      - name: Create GitHub Release and upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release.ts notes "$RELEASE_TAG" "$RELEASE_DIR/release-notes.md"
          assets=("$RELEASE_DIR/kiturone-kapibala-$RELEASE_VERSION.tgz" "$RELEASE_DIR/kiturone-kapibala-mcp-$RELEASE_VERSION.tgz" "$RELEASE_DIR/kiturone-kapibala-cli-$RELEASE_VERSION.tgz" "$RELEASE_DIR/SHA256SUMS.txt")
          if [ -d "$RELEASE_DIR/desktop" ]; then
            while IFS= read -r -d '' file; do
              relative="${file#"$RELEASE_DIR/desktop/"}"
              name="desktop-${relative//\//__}"
              cp "$file" "$RELEASE_DIR/$name"
              assets+=("$RELEASE_DIR/$name")
            done < <(find "$RELEASE_DIR/desktop" -type f -print0)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Kapibala $RELEASE_TAG" --notes-file "$RELEASE_DIR/release-notes.md" --latest
          fi
      - name: Preserve packages and checksums for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kapibala-${{ needs.prepare.outputs.tag }}
          path: ${{ runner.temp }}/kapibala-release/
          if-no-files-found: ignore

  desktop-unsigned:
    # 未签名自用版：Release 发布后自动补齐四平台测试安装包，替代维护者本机打包再手工上传。
    # desktop_only 补跑时 publish 被跳过，因此需 always() 才能进入本作业，向已存在的 Release 增量上传；
    # 构建脚本取自 dispatch 的 ref（含打包工具链修复），产品代码与 tag 的一致性由 packages/ diff 守卫断言。
    # KPBL_DESKTOP_RELEASE=true 时由签名候选流程接管（publish 里下载审核附件），这里不再产出，
    # 避免两套产物在同一 Release 上重名覆盖。
    needs: [prepare, publish]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.desktop == 'true' && vars.KPBL_DESKTOP_RELEASE != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-2025
            target: win32-x64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        # 补跑时构建脚本来自 dispatch ref（main 的工具链修复）；常规发布固定构建 tag 提交。
        with:
          ref: ${{ inputs.desktop_only && github.ref || needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Assert product code matches the release tag
        if: inputs.desktop_only == true
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # 补跑只允许工具链与纯测试规格差异：产品代码必须与已发布 tag 完全一致，
          # 否则安装包内容会偏离 npm 已发布的版本；两套桌面 e2e 规格不进安装包，允许随 UI 修正。
          git diff --exit-code "refs/tags/$RELEASE_TAG" HEAD -- packages/ \
            ':(exclude)packages/desktop/e2e' ':(exclude)packages/desktop/packaged-e2e'
      - uses: pnpm/setup@v3
        with:
          version: 12.4.1
          runtime: node@24
          require-lockfile: true
          cache: true
      - name: Check native target
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: node -e 'if (`${process.platform}-${process.arch}` !== process.env.EXPECTED_TARGET) process.exit(1)'
      - name: Install pinned Electron
        run: pnpm --filter @kiturone/kapibala-desktop exec install-electron
      # 自动门禁已由同 SHA 的 Verify 工作流跑过（含 mac/win 桌面 e2e），这里只做打包与安装副本 smoke，
      # 因此用 --no-verify 跳过重复校验；产物的 test-build.json 会如实写明 verification=skipped。
      - name: Build unsigned test package
        if: runner.os != 'Linux'
        id: package
        run: pnpm pack:desktop --no-verify
      - name: Build unsigned test package under a real virtual display
        if: runner.os == 'Linux'
        id: linux-package
        run: xvfb-run -a pnpm pack:desktop --no-verify
      - name: Upload test installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ steps.package.outputs.artifacts || steps.linux-package.outputs.artifacts }}
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACTS"
          assets=()
          for file in "$ARTIFACTS"/*.dmg "$ARTIFACTS"/*.exe "$ARTIFACTS"/*.zip "$ARTIFACTS"/*.AppImage "$ARTIFACTS"/SHA256SUMS.txt "$ARTIFACTS"/test-build.json; do
            if [ -f "$file" ]; then
              name="desktop-${TARGET}__$(basename "$file")"
              cp "$file" "$RUNNER_TEMP/$name"
              assets+=("$RUNNER_TEMP/$name")
            fi
          done
          test "${#assets[@]}" -ge 2
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Preserve the same bytes for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-unsigned-${{ matrix.target }}-${{ needs.prepare.outputs.sha }}
          path: ${{ steps.package.outputs.artifacts || steps.linux-package.outputs.artifacts }}
          if-no-files-found: ignore
          retention-days: 30
