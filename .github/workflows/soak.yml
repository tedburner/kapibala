name: Soak

on:
  push:
    branches:
      - 'codex/**'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: Soak tier, or collect three full release baseline candidates
        required: false
        default: nightly
        type: choice
        options: [pr, nightly, release, collect-baseline]
      baseline:
        description: Reviewed release baseline file tracked at this commit
        required: false
        default: scripts/fixtures/soak/release-baseline.json
        type: string

permissions:
  contents: read

jobs:
  soak:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier != 'collect-baseline')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 12.4.1
          runtime: node@24
          require-lockfile: true
      - name: Build candidate
        run: pnpm build
      - name: Require the reviewed release baseline
        if: inputs.tier == 'release'
        env:
          SOAK_BASELINE: ${{ inputs.baseline }}
        run: |
          if [ ! -f "$SOAK_BASELINE" ]; then
            echo "Missing reviewed release baseline: $SOAK_BASELINE. See scripts/fixtures/soak/README.md."
            exit 1
          fi
      - name: Run the selected soak tier
        env:
          SOAK_TIER: ${{ inputs.tier || 'nightly' }}
          SOAK_BASELINE: ${{ inputs.baseline }}
        run: |
          if [ "$SOAK_TIER" = release ]; then
            pnpm verify:soak --no-build --tier "$SOAK_TIER" --baseline "$SOAK_BASELINE"
          else
            pnpm verify:soak --no-build --tier "$SOAK_TIER"
          fi
      - name: Preserve soak evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-${{ inputs.tier || 'nightly' }}
          path: .workbuddy/v0.0.10-soak/evidence/*.json
          if-no-files-found: ignore

  collect-baseline:
    if: (github.event_name == 'workflow_dispatch' && inputs.tier == 'collect-baseline') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[collect-baseline]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 12.4.1
          runtime: node@24
          require-lockfile: true
      - name: Build candidate
        run: pnpm build
      - name: Collect three full release runs on one runner (not release acceptance)
        run: |
          for soak_attempt in 1 2 3; do
            soak_started=$(node -p 'Date.now()')
            set +e
            pnpm verify:soak --no-build --tier release
            soak_status=$?
            set -e
            node --import tsx scripts/validate-soak-candidate.ts "$soak_attempt" "$soak_started" "$soak_status"
          done
      - name: Preserve baseline candidates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-baseline-candidates
          path: .workbuddy/v0.0.10-soak/baseline-candidates/
          if-no-files-found: error
