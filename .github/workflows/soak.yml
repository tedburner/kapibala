name: Soak

on:
  push:
    branches:
      - 'codex/**'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: Soak tier, or collect three full release baseline candidates
        required: false
        default: nightly
        type: choice
        options: [pr, nightly, release, collect-baseline]
      baseline:
        description: Reviewed release baseline file tracked at this commit
        required: false
        default: scripts/fixtures/soak/release-baseline.json
        type: string

permissions:
  contents: read

jobs:
  soak:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier != 'collect-baseline')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 12.4.1
          runtime: node@24
          require-lockfile: true
      - name: Build candidate
        run: pnpm build
      - name: Require the reviewed release baseline
        if: inputs.tier == 'release'
        env:
          SOAK_BASELINE: ${{ inputs.baseline }}
        run: |
          if [ ! -f "$SOAK_BASELINE" ]; then
            echo "Missing reviewed release baseline: $SOAK_BASELINE. See scripts/fixtures/soak/README.md."
            exit 1
          fi
      - name: Run the selected soak tier
        env:
          SOAK_TIER: ${{ inputs.tier || 'nightly' }}
          SOAK_BASELINE: ${{ inputs.baseline }}
        run: |
          if [ "$SOAK_TIER" = release ]; then
            pnpm verify:soak --no-build --tier "$SOAK_TIER" --baseline "$SOAK_BASELINE"
          else
            pnpm verify:soak --no-build --tier "$SOAK_TIER"
          fi
      - name: Preserve soak evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-${{ inputs.tier || 'nightly' }}
          path: .workbuddy/v0.0.10-soak/evidence/*.json
          if-no-files-found: ignore

  collect-baseline:
    if: (github.event_name == 'workflow_dispatch' && inputs.tier == 'collect-baseline') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[collect-baseline]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 12.4.1
          runtime: node@24
          require-lockfile: true
      - name: Build candidate
        run: pnpm build
      - name: Collect a full release run without frozen thresholds
        id: collect
        continue-on-error: true
        run: pnpm verify:soak --no-build --tier release
      - name: Validate baseline candidate (not release acceptance)
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          node --import tsx --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { SOAK_TIERS, assertSoakResult, slopePerRound } from './scripts/verify-soak.ts';
          const directory = '.workbuddy/v0.0.10-soak/evidence';
          const files = fs.readdirSync(directory).filter((name) => name.startsWith('soak-release-'));
          assert.equal(files.length, 1, 'Expected one fresh release report');
          const report = JSON.parse(fs.readFileSync(`${directory}/${files[0]}`, 'utf8'));
          assert.equal(process.env.COLLECTION_OUTCOME, 'failure', 'Missing baseline must remain nonzero');
          assert.equal(report.commit, process.env.GITHUB_SHA);
          assert.equal(report.worktreeDirty, false);
          assert.equal(report.debugOverride, false);
          assert.equal(report.environment.platform, 'linux');
          assert.equal(report.environment.arch, 'x64');
          assert.match(report.environment.node, /^v24\./);
          assert.equal(report.tier, 'release');
          assert.deepEqual(report.tierConfig, SOAK_TIERS.release);
          assert.equal(report.verdict.status, 'pending');
          assert.deepEqual(report.verdict.failures, []);
          assert.equal(report.verdict.pending.length, 1);
          assert.match(report.verdict.pending[0], /^Release soak has no frozen RSS\/heap baseline;/);
          assert.equal(report.baseline.status, 'pending');
          assertSoakResult(report.result, SOAK_TIERS.release, 'release');
          assert.notEqual(slopePerRound(report.result.samples, 'heapUsed'), null);
          const rss = ['daemonRss', 'stdioRss'].map((key) => {
            const slope = slopePerRound(report.result.samples, key);
            if (report.result.samples.some((sample) => sample[key] !== null && sample[key] !== undefined))
              assert.notEqual(slope, null, `${key} samples insufficient for a slope`);
            return slope;
          });
          assert(rss.some((slope) => slope !== null), 'Missing host RSS slope');
          fs.writeFileSync(`${directory}/runner-image.json`, JSON.stringify({ image: process.env.ImageOS, version: process.env.ImageVersion, node: process.version }));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\nBaseline candidate collected; thresholds still require review. **Release acceptance remains pending.**\n');
          NODE
      - name: Preserve baseline candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-baseline-candidate-${{ matrix.attempt }}
          path: .workbuddy/v0.0.10-soak/evidence/*.json
          if-no-files-found: error
