<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kapibala">
  <title>Kapibala</title>
  <!--
    方形应用图标：宣石暖纸圆角底 #F2EAE0 + 极简墨线水豚（squircle 裁剪）
    水豚造型的单一真源是 assets/capybara.svg；本文件由 .workbuddy/build-assets.py 派生，改造型请改那一个。
  -->
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="114" ry="114" />
    </clipPath>
<g id="kapibala">
      <!-- 水豚琥珀圆点（头顶小橘 / 状态脉搏） -->
      <circle cx="330" cy="59" r="40.5" fill="var(--kpbl-amber, #C26B33)" />

      <g fill="none" stroke="var(--kpbl-ink, #181816)" stroke-width="23"
         stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="6">
        <!-- 后置圆耳环 -->
        <path d="M 234 173 A 30 30 0 1 1 256 145" />

        <!-- 朝右方吻与静卧背线连续廓形 -->
        <path d="M 278 137
                 H 430
                 A 51 51 0 0 1 481 188
                 V 253
                 A 51 51 0 0 1 430 304
                 H 377
                 A 51 51 0 0 0 326 355
                 V 481
                 H 150
                 A 119 119 0 0 1 31 362
                 V 356
                 A 146 146 0 0 1 177 210
                 H 190
                 A 34 34 0 0 0 216 198
                 L 252 150
                 A 34 34 0 0 1 278 137
                 Z" />

        <!-- 心如止水半阖横眼 -->
        <line x1="309" y1="185.5" x2="351" y2="185.5" stroke-width="22" />
      </g>
    </g>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="512" height="512" fill="#F2EAE0" />
    <rect x="1" y="1" width="510" height="510" rx="113" ry="113"
          fill="none" stroke="#181816" stroke-opacity="0.08" stroke-width="2" />

    <g transform="translate(56 56) scale(0.78125)">
      <use href="#kapibala" />
    </g>
  </g>
</svg>
