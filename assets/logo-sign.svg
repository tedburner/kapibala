<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" role="img" aria-label="卡皮巴拉">
  <title>卡皮巴拉</title>
  <!--
    竖向铭牌组合：极简墨线水豚 + 宣石暖纸墨框 卡皮巴拉 铭牌
    水豚造型的单一真源是 assets/capybara.svg；本文件由 .workbuddy/build-assets.py 派生，改造型请改那一个。
  -->
  <defs>
<g id="kapibala">
      <!-- 水豚琥珀圆点（头顶小橘 / 状态脉搏） -->
      <circle cx="330" cy="59" r="40.5" fill="var(--kpbl-amber, #C26B33)" />

      <g fill="none" stroke="var(--kpbl-ink, #181816)" stroke-width="23"
         stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="6">
        <!-- 后置圆耳环 -->
        <path d="M 234 173 A 30 30 0 1 1 256 145" />

        <!-- 朝右方吻与静卧背线连续廓形 -->
        <path d="M 278 137
                 H 430
                 A 51 51 0 0 1 481 188
                 V 253
                 A 51 51 0 0 1 430 304
                 H 377
                 A 51 51 0 0 0 326 355
                 V 481
                 H 150
                 A 119 119 0 0 1 31 362
                 V 356
                 A 146 146 0 0 1 177 210
                 H 190
                 A 34 34 0 0 0 216 198
                 L 252 150
                 A 34 34 0 0 1 278 137
                 Z" />

        <!-- 心如止水半阖横眼 -->
        <line x1="309" y1="185.5" x2="351" y2="185.5" stroke-width="22" />
      </g>
    </g>
  </defs>

  <g transform="translate(128 28) scale(0.75)">
    <use href="#kapibala" />
  </g>

  <g>
    <rect x="52" y="458" width="536" height="196" rx="24" ry="24"
          fill="#F2EAE0" stroke="#181816" stroke-width="14" stroke-linejoin="round" />
    <text x="325" y="588" text-anchor="middle" text-rendering="geometricPrecision"
          font-family="'STZhongsong','Source Han Serif SC','Noto Serif CJK SC','Songti SC','SimSun',serif" font-size="90" font-weight="400" letter-spacing="10"
          fill="#181816">卡皮巴拉</text>
  </g>
</svg>
