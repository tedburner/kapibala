<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kapibala">
  <title>Kapibala</title>
  <!--
    Kapibala 极简墨线标识（Atelier Monoline）
    色板对齐 017「墨工坊 Ink Atelier」：曜石墨线 #181816（深色模式 #F4F3EE）· 水豚琥珀 #C26B33（深色模式 #E58B52）
    结构：朝右静卧侧影连续等粗墨线（平直吻桥、方钝鼻端、后置圆耳环、半阖横眼）+ 头顶悬置琥珀小橘圆点
    本文件是水豚图形的单一真源，logo / logo-dark / icon / logo-sign / mascot 五个 SVG 均由 .workbuddy/build-assets.py 派生。
  -->
  <defs>
    <g id="kapibala">
      <!-- 水豚琥珀圆点（头顶小橘 / 状态脉搏） -->
      <circle cx="330" cy="59" r="40.5" fill="var(--kpbl-amber, #C26B33)" />

      <g fill="none" stroke="var(--kpbl-ink, #181816)" stroke-width="23"
         stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="6">
        <!-- 后置圆耳环 -->
        <path d="M 234 173 A 30 30 0 1 1 256 145" />

        <!-- 朝右方吻与静卧背线连续廓形 -->
        <path d="M 278 137
                 H 430
                 A 51 51 0 0 1 481 188
                 V 253
                 A 51 51 0 0 1 430 304
                 H 377
                 A 51 51 0 0 0 326 355
                 V 481
                 H 150
                 A 119 119 0 0 1 31 362
                 V 356
                 A 146 146 0 0 1 177 210
                 H 190
                 A 34 34 0 0 0 216 198
                 L 252 150
                 A 34 34 0 0 1 278 137
                 Z" />

        <!-- 心如止水半阖横眼 -->
        <line x1="309" y1="185.5" x2="351" y2="185.5" stroke-width="22" />
      </g>
    </g>
  </defs>

  <use href="#kapibala" />
</svg>
