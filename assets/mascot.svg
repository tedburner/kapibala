<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -48 552 604" width="512" height="560" role="img" aria-label="Kapibala">
  <title>Kapibala</title>
  <!--
    独立循环动图（Animated SVG）：内置明暗自适应与 CSS 关键帧循环，可直接通过 <img> 播放
    水豚造型的单一真源是 assets/capybara.svg；本文件由 .workbuddy/build-assets.py 派生，改造型请改那一个。
  -->
  <style>
    :root { --ink: #181816; --amber: #C26B33; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #F4F3EE; --amber: #E58B52; }
    }
    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1.012, 0.985); }
      50% { transform: translateY(-5px) scale(0.986, 1.028); }
    }
    @keyframes yuzu {
      0%, 100% { transform: translateY(2px) rotate(-1.5deg); }
      50% { transform: translateY(-13px) rotate(2deg); }
    }
    @keyframes steam {
      0% { opacity: 0; transform: translateY(10px) scale(0.85); }
      35% { opacity: 0.72; }
      100% { opacity: 0; transform: translateY(-20px) scale(1.08); }
    }
    @keyframes ear {
      0%, 72%, 86%, 100% { transform: rotate(0deg); }
      76% { transform: rotate(-11deg); }
      81% { transform: rotate(4deg); }
    }
    @keyframes blink {
      0%, 45%, 49%, 95%, 99%, 100% { transform: scaleY(1) scaleX(1); }
      47%, 97% { transform: scaleY(0.18) scaleX(1.14); }
    }
    @keyframes ripple {
      0%, 100% { opacity: 0.22; transform: scaleX(0.92); }
      50% { opacity: 0.48; transform: scaleX(1.06); }
    }
    .body { transform-origin: 220px 481px; animation: breathe 3.2s ease-in-out infinite; }
    .yuzu { transform-origin: 330px 59px; animation: yuzu 3.2s ease-in-out -0.45s infinite; }
    .steam { transform-origin: 330px 0px; animation: steam 2.8s ease-out infinite; }
    .steam2 { animation-delay: -1.4s; }
    .ear { transform-origin: 245px 158px; animation: ear 4.8s ease-in-out infinite; }
    .eye { transform-origin: 330px 185.5px; animation: blink 5.4s ease-in-out infinite; }
    .rip { transform-origin: 227px 518px; animation: ripple 3.2s ease-in-out infinite; }
    .rip2 { transform-origin: 227px 544px; animation-delay: -1.1s; }
    @media (prefers-reduced-motion: reduce) {
      .body, .yuzu, .steam, .ear, .eye, .rip { animation: none; }
      .steam { opacity: 0.45; }
    }
  </style>
  <g fill="none" stroke="var(--amber)" stroke-width="14" stroke-linecap="round">
    <path class="steam" d="M 274 8 Q 262 -12 274 -30" />
    <path class="steam steam2" d="M 386 12 Q 398 -8 386 -26" />
  </g>
  <g class="yuzu">
    <circle cx="330" cy="59" r="40.5" fill="var(--amber)" />
  </g>
  <g class="body" fill="none" stroke="var(--ink)" stroke-width="23" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="6">
    <path class="ear" d="M 234 173 A 30 30 0 1 1 256 145" />
    <path d="M 278 137 H 430 A 51 51 0 0 1 481 188 V 253 A 51 51 0 0 1 430 304 H 377 A 51 51 0 0 0 326 355 V 481 H 150 A 119 119 0 0 1 31 362 V 356 A 146 146 0 0 1 177 210 H 190 A 34 34 0 0 0 216 198 L 252 150 A 34 34 0 0 1 278 137 Z" />
    <line class="eye" x1="309" y1="185.5" x2="351" y2="185.5" stroke-width="22" />
  </g>
  <g fill="none" stroke="var(--ink)" stroke-linecap="round">
    <line class="rip" x1="76" y1="518" x2="378" y2="518" stroke-width="16" />
    <line class="rip rip2" x1="146" y1="544" x2="308" y2="544" stroke-width="13" />
  </g>
</svg>
